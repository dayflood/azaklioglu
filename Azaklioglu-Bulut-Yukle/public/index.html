<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Azaklıoğlu</title>
<style>
/* ---------- renk tokenları: açık ve koyu tema ---------- */
:root{
  --bg:#f7f7f5;--card:#ffffff;--ink:#17161f;--ink2:#4b4a57;--muted:#8a8896;--line:#e9e8ee;--line-strong:#cfcdd8;--soft:#f3f3f1;
  --accent:#ffffff;--accent-txt:#17161f;--accent-d:#4b4a57;--accent-l:#efeef3;--accent-border:#d6d5dd;
  --debt:#b42318;--debt-txt:#b42318;--debt-l:#fdf1f0;--debt-line:#f3c4be;
  --paid:#067647;--paid-txt:#067647;--paid-l:#eefaf3;
  --amber:#b45309;--amber-l:#fff7ec;
  --toast-bg:#17161f;--toast-ink:#ffffff;
  --on-accent:#17161f;--accent-hover:#f3f3f1;--lip-accent:#d6d5dd;--toast-accent:#ffffff;--dock-bg:rgba(255,255,255,.86);--dock-border:rgba(23,22,31,.08);--dock-ind:#ffffff;--dock-ink:#6b6a78;--dock-ink-on:#17161f;--gate-a:#2b2936;--gate-b:#1a1923;--gate-c:#0f0e15;--gate-ink:#ffffff;--gate-sub:#b9b7c4;
  --red:var(--debt-txt);--green:var(--paid-txt);--red-l:var(--debt-l);--green-l:var(--paid-l);
  --serif:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--r:14px;--c:10px;
}
:root[data-theme="dark"]{
  --bg:#0f0e15;--card:#1a1923;--ink:#f1f0f6;--ink2:#c4c2d1;--muted:#8d8a9c;--line:#2b2936;--line-strong:#44414f;--soft:#222029;
  --accent:#f1f0f6;--accent-txt:#f1f0f6;--accent-d:#c4c2d1;--accent-l:#2b2936;--on-accent:#17161f;--accent-border:#f1f0f6;--accent-hover:#ffffff;--lip-accent:#44414f;--toast-accent:#4f46e5;--dock-bg:rgba(44,42,56,.72);--dock-border:rgba(255,255,255,.12);--dock-ind:rgba(255,255,255,.14);--dock-ink:#a8a6b6;--dock-ink-on:#ffffff;--gate-a:#2b2936;--gate-b:#1a1923;--gate-c:#0f0e15;--gate-ink:#f1f0f6;--gate-sub:#8d8a9c;
  --debt:#d9473d;--debt-txt:#fb8a80;--debt-l:#33191c;--debt-line:#5a2a2c;
  --paid:#12915a;--paid-txt:#6ee7a6;--paid-l:#13291f;
  --amber:#fbbf24;--amber-l:#2e2612;
  --toast-bg:#f1f0f6;--toast-ink:#17161f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0e15;--card:#1a1923;--ink:#f1f0f6;--ink2:#c4c2d1;--muted:#8d8a9c;--line:#2b2936;--line-strong:#44414f;--soft:#222029;
    --accent:#f1f0f6;--accent-txt:#f1f0f6;--accent-d:#c4c2d1;--accent-l:#2b2936;--on-accent:#17161f;--accent-border:#f1f0f6;--accent-hover:#ffffff;--lip-accent:#44414f;--toast-accent:#4f46e5;--dock-bg:rgba(44,42,56,.72);--dock-border:rgba(255,255,255,.12);--dock-ind:rgba(255,255,255,.14);--dock-ink:#a8a6b6;--dock-ink-on:#ffffff;--gate-a:#2b2936;--gate-b:#1a1923;--gate-c:#0f0e15;--gate-ink:#f1f0f6;--gate-sub:#8d8a9c;
    --debt:#d9473d;--debt-txt:#fb8a80;--debt-l:#33191c;--debt-line:#5a2a2c;
    --paid:#12915a;--paid-txt:#6ee7a6;--paid-l:#13291f;
    --amber:#fbbf24;--amber-l:#2e2612;
    --toast-bg:#f1f0f6;--toast-ink:#17161f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
/* ---------- ayarlar: yan önizleme ---------- */
.set-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start;margin-top:8px}
.set-side{display:grid;gap:16px;position:sticky;top:20px}
.set-main{display:grid;gap:16px;min-width:0}
.paper{background:var(--soft);border-radius:12px;padding:18px}
.pv-name{font-size:18px;font-weight:650;letter-spacing:-.3px;overflow-wrap:anywhere}
.pv-meta{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.pv-line{border-top:1px dashed var(--line-strong);margin:14px 0}
.pv-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;padding:3px 0}
.pv-row b{font-size:16px}
@media (max-width:900px){
  .set-grid{grid-template-columns:1fr}
  .set-side{position:static;order:2}
}
[hidden]{display:none!important}

/* ---------- yerleşim ---------- */
.shell{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100vh}
.content{min-width:0}
.top{display:flex;align-items:flex-end;gap:16px;padding:30px 36px 8px;min-height:0;background:none}
.ttl{flex:1;min-width:0}
.top h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:650;letter-spacing:-.6px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;margin-top:4px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{margin:0;padding:8px 36px 64px;max-width:none}
.h2{font-size:15px;font-weight:600;color:var(--ink);margin:30px 0 10px}

/* ---------- sol ray (masaüstü) ---------- */
.rail-brand{display:none}
#nav{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:visible;padding:0;z-index:20}
#items{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;width:100%;padding:0 10px 16px}
.ind{position:absolute;top:0;bottom:auto;left:10px;right:10px;width:auto;height:0;border-radius:14px;z-index:1;pointer-events:none;background:var(--accent-l);transition:transform .6s cubic-bezier(.34,1.5,.64,1),height .6s cubic-bezier(.34,1.5,.64,1)}
#nav .nb{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:14px 4px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;border-radius:14px}
#nav .nb span{white-space:nowrap}
#nav .nb.on{color:var(--accent-txt)}
#nav .nb:hover:not(.on){color:var(--ink2)}
#nav .nb svg{flex:none}
.rail-brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 0 18px;margin:0 10px 10px;border-bottom:1px solid var(--line)}
.rail-brand b{box-shadow:inset 0 0 0 1px var(--accent-border);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--on-accent);background:var(--accent)}
.rail-brand span{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}

/* ---------- kartlar ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.flat{padding:0;overflow:hidden}
.grid4,.g3{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4 .card.stat,.g3 .card.stat{border:0;border-radius:0;padding:20px 22px;background:var(--card)}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:650;letter-spacing:-.6px;margin-top:6px;line-height:1.1}
.stat .s{font-size:12px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:20px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.ph h3{margin:0;font-size:15px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer;transition:background .15s}
.row.click:hover,.tbl-r:hover{background:var(--soft)}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.red{color:var(--debt-txt)} .green{color:var(--paid-txt)} .muted{color:var(--muted)} .r{text-align:right}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-l);color:var(--accent-txt);display:grid;place-items:center;font-size:12px;font-weight:700}
.ico-dot{flex:none;width:22px;text-align:center;font-size:20px;font-weight:600;line-height:1}
.ico-dot.d{color:var(--debt)}
.ico-dot.p{color:var(--paid)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.help{font-size:13px;color:var(--muted);margin:8px 0 0}
.stat-box{display:flex;gap:12px}

/* ---------- tablolar ---------- */
.tbl-h,.tbl-r{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 120px 120px;gap:16px;align-items:center;padding:13px 20px}
.tbl-h{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl-r{border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.tbl-r:last-child{border-bottom:0}
.tot{background:var(--soft);border-top:1px solid var(--line);border-bottom:0;color:var(--ink);font-size:14px;font-weight:600}
.nmc{display:flex;align-items:center;gap:10px;min-width:0}
.ledger{grid-template-columns:96px minmax(0,1fr) 110px 110px 120px}

/* ---------- rozet ---------- */
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;vertical-align:middle;margin-left:8px}
.badge.red{background:var(--debt-l);color:var(--debt)}
.badge.green{background:var(--paid-l);color:var(--paid)}
.badge.amber{background:var(--amber-l);color:var(--amber)}

/* ---------- müşteri özeti ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.hero .l{font-size:13px;color:var(--muted)}
.hero .big{font-family:var(--serif);font-size:44px;font-weight:650;letter-spacing:-1.2px;line-height:1.05;margin-top:6px;color:var(--debt-txt)}
.hero .big.zero{color:var(--ink)}
.hero .actions{display:flex;gap:10px;min-width:300px;flex:0 1 auto}
.hero .actions .btn{flex:1}
.hero + .btns{margin-top:14px}

/* ---------- düğmeler ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:var(--c);background:var(--card);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;box-shadow:0 3px 0 var(--line);transition:transform .1s ease,box-shadow .1s ease,background-color .15s ease,color .15s ease}
.btn:hover{background:var(--soft);transform:translateY(-1px);box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{--lip:var(--lip-accent);background:var(--accent);border-color:var(--accent-border);color:var(--on-accent);box-shadow:0 3px 0 var(--lip)}
.btn.primary:hover{background:var(--accent-hover);box-shadow:0 4px 0 var(--lip)}
.btn.primary:active{box-shadow:0 0 0 var(--lip)}
.btn.debt{--lip:#7a160f;background:var(--debt);border-color:var(--debt);color:#fff;box-shadow:0 3px 0 var(--lip)}
.btn.debt:hover{background:#a01d14;box-shadow:0 4px 0 var(--lip)}
.btn.debt:active{box-shadow:0 0 0 var(--lip)}
.btn.pay{--lip:#044d2c;background:var(--paid);border-color:var(--paid);color:#fff;box-shadow:0 3px 0 var(--lip)}
.btn.pay:hover{background:#05663a;box-shadow:0 4px 0 var(--lip)}
.btn.pay:active{box-shadow:0 0 0 var(--lip)}
.btn.danger{color:var(--debt-txt);border-color:var(--debt-line);box-shadow:0 3px 0 var(--debt-line)}
.btn.danger:hover{background:var(--debt-l)}
.btn.lg{min-height:50px;font-size:16px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 16px}
.search{flex:1 1 240px;min-width:0;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:var(--c);background:var(--card);font-size:15px}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--c);background:var(--card);color:var(--ink);font-size:15px}
.search:focus,.inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{width:auto;padding:0 12px;height:40px}

/* ---------- seçiciler (kayan balonlu) ---------- */
.seg{position:relative;display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{position:relative;z-index:1;border:0;background:none;height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:color .3s ease}
.seg button:hover:not(.on){color:var(--ink2)}
.seg button.on{color:var(--on-accent)}
.sind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:9px;z-index:0;pointer-events:none;background:var(--accent);border:1px solid var(--accent-border);box-shadow:0 1px 2px rgba(23,22,31,.1);transition:transform .6s cubic-bezier(.34,1.5,.64,1),width .6s cubic-bezier(.34,1.5,.64,1)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:34px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;font-size:13px;font-weight:600;color:var(--ink2);transition:transform .1s ease,background-color .15s ease}
.pill:active{transform:translateY(2px) scale(.97)}
.pill.on{background:var(--accent);border-color:var(--accent-border);color:var(--on-accent)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
.lbl .opt{font-weight:400;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--accent-l)}
.preview .l{font-size:13px;color:var(--ink2)}
.preview .b{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.3px;margin-top:2px}
.preview .n{font-size:13px;color:var(--ink2);margin-top:4px}
.preview.bad{background:var(--debt-l)}
.preview.bad .b{color:var(--debt-txt)}
.err{color:var(--debt-txt);font-size:13px;font-weight:600;min-height:20px;margin-top:10px}
.kvr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kvr:last-child{border-bottom:0}
.note-box{white-space:pre-wrap;font-size:14px;background:var(--soft);padding:14px;border-radius:var(--c);margin:0}

/* ---------- grafik ---------- */
.chart{display:flex;align-items:flex-end;gap:10px;height:200px;padding:20px 20px 0}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;min-width:0}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px}
.bar{width:14px;border-radius:4px 4px 0 0}
.bar.d{background:#f1b8b1}
.bar.p{background:#a6dfc0}
.col .lb{font-size:12px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:0 20px 18px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---------- pencere ---------- */
#modal:not(:empty){position:fixed;inset:0;z-index:40;background:rgba(23,22,31,.32);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(540px,100%);max-height:88vh;background:var(--card);border-radius:18px;box-shadow:0 24px 60px rgba(23,22,31,.2);display:flex;flex-direction:column;animation:pop .18s ease-out;overflow:hidden}
.sh{padding:20px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:600}
.sb{padding:0 24px 20px;overflow:auto}
.sf{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--soft)}
.x{border:0;background:var(--soft);width:32px;height:32px;border-radius:9px;font-size:15px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:10px 12px 10px 18px;border-radius:12px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:0 12px 28px rgba(23,22,31,.25);font-size:14px;animation:up .22s ease-out;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--toast-accent);font-weight:700;padding:4px 8px;border-radius:6px}
.toast button:hover{background:rgba(255,255,255,.08)}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- canlı senkronizasyon göstergesi ---------- */
.sync-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s ease;white-space:nowrap;user-select:none}
.sync-pill:hover{background:var(--soft);border-color:var(--line-strong)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#b42318;flex-shrink:0;transition:background .3s}
.sync-dot.on{background:#067647;box-shadow:0 0 0 3px rgba(6,118,71,.2);animation:syncPulse 2.2s infinite}
.sync-dot.pending{background:#b45309;animation:syncPulse 1s infinite}
@keyframes syncPulse{0%{transform:scale(.92);opacity:.8}50%{transform:scale(1.2);opacity:1}100%{transform:scale(.92);opacity:.8}}


/* ---------- masaüstü: ray ---------- */
@media (min-width:901px){
  .shell{grid-template-columns:96px minmax(0,1fr)}
  #nav{width:96px}
  .toast{bottom:28px}
}

/* ---------- telefon: alt cam dock ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  #nav{position:fixed;top:auto;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;right:auto;transform:translateX(-50%);width:min(580px,calc(100vw - 24px));height:auto;flex-direction:row;padding:6px;border-radius:30px;overflow:hidden;z-index:20;
    border:1px solid var(--dock-border);background:var(--dock-bg);
    backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 16px 40px rgba(30,27,75,.35)}
  .rail-brand{display:none}
  #items{flex-direction:row;padding:0;gap:0;justify-content:stretch}
  .ind{top:6px;bottom:6px;left:6px;width:0;height:auto;border-radius:24px;background:var(--dock-ind);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 18px rgba(30,27,75,.3);transition:transform .6s cubic-bezier(.34,1.5,.64,1),width .6s cubic-bezier(.34,1.5,.64,1)}
  #nav .nb{flex:1 1 0;min-width:0;padding:9px 4px;border-radius:24px;color:var(--dock-ink);background:none}
  #nav .nb.on{color:var(--dock-ink-on)}
  #nav .nb:hover:not(.on){color:var(--dock-ink-on);background:none}
  #nav .nb:active{transform:scale(.92)}
  main{padding:4px 16px 120px}
  .top{padding:22px 18px 6px}
  .top h1{font-size:26px}
  .grid4,.g3{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .tbl-h,.tbl-r{grid-template-columns:minmax(0,1fr) 110px}
  .c2,.c3{display:none}
  .ledger{grid-template-columns:70px minmax(0,1fr) 84px 84px}
  .ledger>span:nth-child(5){display:none}
  .toast{bottom:110px}
  #modal:not(:empty){align-items:flex-end;padding:0}
  .sheet{width:100%;max-height:90vh;border-radius:18px 18px 0 0}
  .frow{grid-template-columns:1fr}

<script>
function getTheme(){ try{ return localStorage.getItem("azaklioglu-tema") || "system"; }catch(e){ return "system"; } }
function applyTheme(t){ const th = t || getTheme(); if(th === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", th); }
function setTheme(t){ try{ localStorage.setItem("azaklioglu-tema", t); }catch(e){} applyTheme(t); render(); }
applyTheme();
const KEY = 'veresiye-defteri-v3'; // önceki sürümle aynı: kayıtlarınız korunur

const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat('tr-TR', {style:'currency', currency:'TRY', minimumFractionDigits:2}).format(n || 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ymd = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const fmtDate = d => { const [y, m, dd] = d.split('-'); return `${dd}.${m}.${y}`; };
const num = s => parseFloat(String(s ?? '').replace(',', '.')) || 0;
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(s => s[0] || '').join('').toUpperCase();
const daysSince = d => Math.floor((Date.now() - new Date(d + 'T00:00:00').getTime()) / 86400000);

/* ---------- veri ---------- */
function blank(){ return {customers:[], transactions:[], products:[], settings:{name:'', phone:'', address:''}, _deleted:{customers:[], transactions:[], products:[]}, lastUpdated:Date.now()}; }
function normalize(d){
  d.settings = d.settings || {name:'', phone:'', address:''};
  d.products = Array.isArray(d.products) ? d.products : [];
  d._deleted = d._deleted || {customers:[], transactions:[], products:[]};
  return d;
}
function trackDeletion(type, id){
  db._deleted = db._deleted || {customers:[], transactions:[], products:[]};
  db._deleted[type] = db._deleted[type] || [];
  if(!db._deleted[type].includes(id)) db._deleted[type].push(id);
}
function untrackDeletion(type, id){
  if(db._deleted && db._deleted[type]) {
    db._deleted[type] = db._deleted[type].filter(x => x !== id);
  }
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && Array.isArray(d.customers) && Array.isArray(d.transactions)) return normalize(d);
  }catch(e){}
  return blank();
}
function save(){
  db.lastUpdated = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('Kayıt yapılamadı. Tarayıcı deposu dolu olabilir.'); }
  if(typeof syncEngine !== 'undefined') syncEngine.push(db);
}
let db = load();
let ui = {view:'home', cid:null, from:'home', filter:'all', sort:'high', q:'', period:'month', rs:'', re:''};

/* ---------- canlı senkronizasyon motoru ---------- */
const CLIENT_ID = 'cli_' + Math.random().toString(36).slice(2, 9);
const SYNC_SERVER_KEY = 'azaklioglu_server_url';

function getDefaultServerUrl(){
  try {
    const saved = localStorage.getItem(SYNC_SERVER_KEY);
    if(saved) return saved;
  }catch(e){}
  if(window.location.protocol.startsWith('http')){
    return window.location.origin;
  }
  return 'http://192.168.1.198:3000';
}

function mergeLocalAndRemote(local, remote){
  if(!remote || (!remote.customers && !remote.transactions)) return local;
  if(!local || (!local.customers && !local.transactions)) return remote;

  const res = {
    settings: { ...(local.settings || {}), ...(remote.settings || {}) },
    _deleted: {
      customers: Array.from(new Set([...(local._deleted?.customers || []), ...(remote._deleted?.customers || [])])),
      transactions: Array.from(new Set([...(local._deleted?.transactions || []), ...(remote._deleted?.transactions || [])])),
      products: Array.from(new Set([...(local._deleted?.products || []), ...(remote._deleted?.products || [])]))
    },
    customers: [],
    transactions: [],
    products: [],
    lastUpdated: Math.max(local.lastUpdated || 0, remote.lastUpdated || 0, Date.now())
  };

  const cMap = new Map();
  for(const c of (local.customers || [])){
    if(!res._deleted.customers.includes(c.id)) cMap.set(c.id, c);
  }
  for(const c of (remote.customers || [])){
    if(!res._deleted.customers.includes(c.id)) cMap.set(c.id, { ...(cMap.get(c.id) || {}), ...c });
  }
  res.customers = Array.from(cMap.values());

  const tMap = new Map();
  for(const t of (local.transactions || [])){
    if(!res._deleted.transactions.includes(t.id)) tMap.set(t.id, t);
  }
  for(const t of (remote.transactions || [])){
    if(!res._deleted.transactions.includes(t.id)) tMap.set(t.id, { ...(tMap.get(t.id) || {}), ...t });
  }
  res.transactions = Array.from(tMap.values());

  const pMap = new Map();
  for(const p of (local.products || [])){
    if(!res._deleted.products.includes(p.id)) pMap.set(p.id, p);
  }
  for(const p of (remote.products || [])){
    if(!res._deleted.products.includes(p.id)) pMap.set(p.id, { ...(pMap.get(p.id) || {}), ...p });
  }
  res.products = Array.from(pMap.values());

  return res;
}

class SyncEngine {
  constructor(){
    this.serverUrl = getDefaultServerUrl();
    this.status = 'disconnected'; // 'connected', 'connecting', 'disconnected'
    this.ws = null;
    this.reconnectTimer = null;
    this.clientsCount = 1;
    this.lastSyncTime = null;
    this.pendingPush = false;
  }
  setServerUrl(url){
    let clean = (url || '').trim().replace(/\/+$/, '');
    if(!clean) clean = 'http://localhost:3000';
    if(!clean.startsWith('http://') && !clean.startsWith('https://')) clean = 'http://' + clean;
    try {
      const u = new URL(clean);
      if(!u.port && /^\d+\.\d+\.\d+\.\d+$/.test(u.hostname)){
        clean = `${u.protocol}//${u.hostname}:3000`;
      }
    } catch(e){}
    this.serverUrl = clean;
    try { localStorage.setItem(SYNC_SERVER_KEY, clean); } catch(e){}
    this.reconnect();
  }
  getWsUrl(){
    try {
      const u = new URL(this.serverUrl);
      const proto = u.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${proto}//${u.host}/ws`;
    } catch(e){
      return 'ws://localhost:3000/ws';
    }
  }
  connect(){
    if(this.ws){
      try { this.ws.close(); } catch(e){}
      this.ws = null;
    }
    this.status = 'connecting';
    this.updateUI();

    const wsUrl = this.getWsUrl();
    try {
      this.ws = new WebSocket(wsUrl);
    } catch(err){
      this.onDisconnected();
      return;
    }

    this.ws.onopen = () => {
      this.status = 'connected';
      this.lastSyncTime = new Date();
      this.updateUI();
      if(this.pendingPush){
        this.push(db);
        this.pendingPush = false;
      }
    };

    this.ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if(msg.type === 'INIT'){
          this.clientsCount = msg.clientsCount || 1;
          this.handleIncomingData(msg.data, false);
        } else if(msg.type === 'SYNC_UPDATE'){
          if(msg.senderId !== CLIENT_ID){
            this.handleIncomingData(msg.data, true);
          }
        } else if(msg.type === 'CLIENTS_COUNT'){
          this.clientsCount = msg.count || 1;
          this.updateUI();
        }
      } catch(err){
        console.error('WS mesaj hatası:', err);
      }
    };

    this.ws.onclose = () => { this.onDisconnected(); };
    this.ws.onerror = () => { this.onDisconnected(); };
  }
  onDisconnected(){
    this.status = 'disconnected';
    this.ws = null;
    this.updateUI();
    clearTimeout(this.reconnectTimer);
    this.reconnectTimer = setTimeout(() => { this.connect(); }, 3500);
  }
  reconnect(){
    clearTimeout(this.reconnectTimer);
    this.connect();
  }
  push(data){
    if(this.status === 'connected' && this.ws && this.ws.readyState === WebSocket.OPEN){
      try {
        this.ws.send(JSON.stringify({
          type: 'SYNC_PUSH',
          data,
          clientId: CLIENT_ID,
          timestamp: Date.now()
        }));
        this.lastSyncTime = new Date();
        this.updateUI();
        return;
      } catch(e){}
    }
    this.pendingPush = true;
    this.pushViaHttp(data);
  }
  async pushViaHttp(data){
    try {
      const res = await fetch(`${this.serverUrl}/api/sync`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data, clientId: CLIENT_ID })
      });
      if(res.ok){
        this.pendingPush = false;
        this.lastSyncTime = new Date();
      }
    } catch(e){}
  }
  async fetchFromServer(){
    try {
      toast('Sunucudan çekiliyor…');
      const res = await fetch(`${this.serverUrl}/api/data`);
      if(res.ok){
        const json = await res.json();
        if(json.success && json.data){
          this.handleIncomingData(json.data, true);
          toast('Sunucuyla eşitlendi ✅');
          return true;
        }
      }
    } catch(e){}
    toast('Sunucuya ulaşılamadı');
    return false;
  }
  handleIncomingData(remoteDb, showToast){
    if(!remoteDb) return;
    const merged = mergeLocalAndRemote(db, remoteDb);
    db = normalize(merged);
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){}
    this.lastSyncTime = new Date();
    this.updateUI();
    render();
    if(showToast) toast('Veriler senkronize edildi ⚡');
  }
  getLabel(){
    if(this.status === 'connected'){
      return this.clientsCount > 1 ? `Canlı (${this.clientsCount} cihaz)` : 'Canlı bağlı';
    }
    if(this.status === 'connecting') return 'Bağlanıyor…';
    return 'Çevrimdışı';
  }
  updateUI(){
    const pill = $('#sync-pill');
    if(pill){
      const dot = pill.querySelector('.sync-dot');
      const label = pill.querySelector('.sync-label');
      if(dot) dot.className = `sync-dot ${this.status === 'connected' ? 'on' : this.status === 'connecting' ? 'pending' : ''}`;
      if(label) label.textContent = this.getLabel();
    }
  }
}
const syncEngine = new SyncEngine();


/* ---------- hesap (kuruş cinsinden tam sayı) ---------- */
const txsOf = cid => db.transactions.filter(t => t.customerId === cid);
function balanceK(cid, exceptId){
  return txsOf(cid).filter(t => t.id !== exceptId).reduce((s, t) => s + (t.type === 'debt' ? t.kurus : -t.kurus), 0);
}
function totalReceivable(){
  return db.customers.reduce((s, c) => { const b = balanceK(c.id); return s + (b > 0 ? b : 0); }, 0) / 100;
}
const sumType = (list, type) => list.filter(t => t.type === type).reduce((s, t) => s + t.kurus, 0);
function lastPayDate(cid){ return txsOf(cid).filter(t => t.type === 'payment').reduce((m, t) => t.date > m ? t.date : m, ''); }
function firstDebtDate(cid){ const ds = txsOf(cid).filter(t => t.type === 'debt').map(t => t.date).sort(); return ds[0] || ''; }
function sortedDesc(list){ return [...list].sort((x, y) => y.date.localeCompare(x.date) || (y.createdAt || 0) - (x.createdAt || 0)); }
function ledgerRows(cid){
  const asc = [...txsOf(cid)].sort((x, y) => x.date.localeCompare(y.date) || (x.createdAt || 0) - (y.createdAt || 0));
  let run = 0;
  return asc.map(t => { run += t.type === 'debt' ? t.kurus : -t.kurus; return {t, run}; }).reverse();
}
function overdue(){
  return db.customers.map(c => {
    const b = balanceK(c.id);
    if(b <= 0) return null;
    const last = lastPayDate(c.id) || firstDebtDate(c.id);
    return {c, b, days: daysSince(last)};
  }).filter(x => x && x.days >= 30).sort((a, b) => b.days - a.days);
}

/* ---------- simgeler ---------- */
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-6M22 20H2"/>',
  gear:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>'
};
const svg = (k, size = 20) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- ortak parçalar ---------- */
const stat = (l, v, cls, s) => `<div class="card stat"><div class="l">${l}</div><div class="v ${cls || ''}">${v}</div><div class="s">${s}</div></div>`;
const emptyBox = (t, s) => `<div class="empty"><b>${t}</b>${s}</div>`;
const kv = (k, v) => `<div class="kvr"><span class="muted">${k}</span><span style="font-weight:600;text-align:right">${v}</span></div>`;

function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(n => n.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Geri al</button>' : ''}`;
  if(undo) el.querySelector('button').onclick = () => { el.remove(); undo(); };
  document.body.appendChild(el);
  setTimeout(() => el.remove(), undo ? 6000 : 2200);
}
function openSheet(title, body, footer){
  $('#modal').innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <div class="sh"><h2>${title}</h2><button class="x" onclick="closeSheet()" aria-label="Kapat">✕</button></div>
    <div class="sb">${body}</div>
    ${footer ? `<div class="sf">${footer}</div>` : ''}
  </div>`;
  const first = $('#modal input');
  if(first && window.innerWidth > 900) first.focus();
}
function closeSheet(){ $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* ---------- gezinme ---------- */
function go(view, cid){
  if(view === 'customer'){
    if(ui.view !== 'customer') ui.from = ui.view;
    ui.cid = cid;
  }
  ui.view = view;
  closeSheet();
  window.scrollTo(0, 0);
  render();
}
const segLast = {};
function segSlide(){
  document.querySelectorAll('.seg[data-seg]').forEach(seg => {
    const key = seg.dataset.seg, on = seg.querySelector('button.on'), ind = seg.querySelector('.sind');
    if(!on || !ind) return;
    const x = on.offsetLeft, w = on.offsetWidth, prev = segLast[key];
    ind.style.transition = 'none';
    const fromX = prev ? prev.x : x, fromW = prev ? prev.w : w;
    ind.style.transform = `translateX(${fromX}px)`; ind.style.width = fromW + 'px';
    void ind.offsetWidth;
    ind.style.transition = '';
    ind.style.transform = `translateX(${x}px)`; ind.style.width = w + 'px';
    segLast[key] = {x, w};
  });
}
function render(){
  if(ui.view === 'customer' && !db.customers.some(c => c.id === ui.cid)) ui.view = 'customers';
  const views = {home:viewHome, customers:viewCustomers, customer:viewCustomer, products:viewProducts, reports:viewReports, settings:viewSettings};
  const v = views[ui.view]();
  const syncBtn = typeof syncEngine !== 'undefined' ? `
    <button class="sync-pill" onclick="openSyncModal()" title="Canlı Senkronizasyon Durumu" id="sync-pill">
      <span class="sync-dot ${syncEngine.status === 'connected' ? 'on' : syncEngine.status === 'connecting' ? 'pending' : ''}"></span>
      <span class="sync-label">${syncEngine.getLabel()}</span>
    </button>` : '';
  $('#top').innerHTML = `${v.back ? `<button class="btn" onclick="${v.back}">‹ Geri</button>` : ''}
    <div class="ttl"><h1>${v.title}</h1>${v.sub ? `<span class="sub">${v.sub}</span>` : ''}</div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      ${syncBtn}
      ${v.actions || ''}
    </div>`;
  $('#main').innerHTML = v.html;
  renderNav();
  segSlide();
}
function renderNav(){
  const cur = ui.view === 'customer' ? 'customers' : ui.view;
  const items = [['home','home','Genel'],['customers','users','Müşteriler'],['products','box','Ürünler'],['reports','chart','Raporlar'],['settings','gear','Ayarlar']];
  $('#items').innerHTML = `<div class="rail-brand"><b>A</b><span>Azaklıoğlu</span></div>` + items.map(([k, i, l]) => `<button class="nb ${cur === k ? 'on' : ''}" onclick="go('${k}')">${svg(i)}<span>${l}</span></button>`).join('');
  moveInd(!$('#ind').dataset.ready);
  $('#ind').dataset.ready = '1';
}
function moveInd(instant){
  const a = document.querySelector('#items .nb.on'), ind = $('#ind');
  if(!a || !ind) return;
  const vertical = matchMedia('(min-width:901px)').matches;
  if(instant) ind.style.transition = 'none';
  if(vertical){
    ind.style.width = ''; ind.style.height = a.offsetHeight + 'px';
    ind.style.transform = `translateY(${$('#items').offsetTop + a.offsetTop}px)`;
  } else {
    ind.style.height = ''; ind.style.width = a.offsetWidth + 'px';
    ind.style.transform = `translateX(${a.offsetLeft}px)`;
  }
  if(instant){ void ind.offsetWidth; ind.style.transition = ''; }
}
window.addEventListener('resize', () => moveInd(true));

/* ---------- genel bakış ---------- */
function txRowHTML(t, withName){
  const c = db.customers.find(x => x.id === t.customerId);
  const d = t.type === 'debt';
  const meta = [
    withName && c ? esc(c.name) : '',
    d ? (t.qty ? `${t.qty} ${esc(t.unit || '')} × ${money(t.price)}` : '') : esc(t.method || 'Ödeme'),
    t.note ? esc(t.note) : ''
  ].filter(Boolean).join(' · ');
  return `<div class="row click" onclick="txMenu('${t.id}')">

      <select class="inp" onchange="ui.sort=this.value;updateList()">${[['high','Borcu en çok olan'],['low','Borcu en az olan'],['recent','Son ödemesi en eski'],['name','Ada göre']].map(([k, l]) =>
        `<option value="${k}" ${ui.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    <div class="card flat" id="list">${listHTML()}</div>`};
}
function listHTML(){
  const head = `<div class="tbl-h"><span>Müşteri</span><span class="c2">Telefon</span><span class="c3">Son ödeme</span><span class="r">Borç</span></div>`;
  if(!db.customers.length) return head + emptyBox('Henüz müşteri yok', 'Sağ üstteki “+ Yeni müşteri” ile ilk müşterinizi ekleyin.');
  const q = ui.q.trim().toLowerCase(), qd = q.replace(/\s/g, '');
  let arr = db.customers.map(c => ({c, b:balanceK(c.id), lp:lastPayDate(c.id)})).filter(x => {
    if(ui.filter === 'debt' && x.b <= 0) return false;
    if(ui.filter === 'nodebt' && x.b > 0) return false;
    if(!q) return true;
    return x.c.name.toLowerCase().includes(q) || (qd && (x.c.phone || '').replace(/\s/g, '').includes(qd));
  });
  const cmp = {
    high:(x, y) => y.b - x.b,
    low:(x, y) => x.b - y.b,
    recent:(x, y) => (x.lp || '0').localeCompare(y.lp || '0'),
    name:(x, y) => x.c.name.localeCompare(y.c.name, 'tr')
  }[ui.sort];
  arr.sort(cmp);
  if(!arr.length) return head + emptyBox('Sonuç yok', 'Aramayı ya da filtreyi değiştirin.');
  return head + arr.map(({c, b, lp}) => `
    <div class="tbl-r" onclick="go('customer','${c.id}')">
      <div class="nmc"><div class="av">${esc(initials(c.name))}</div><span class="t1">${esc(c.name)}</span></div>
      <div class="c2 muted">${esc(c.phone || '—')}</div>
      <div class="c3 muted">${lp ? fmtDate(lp) : (b > 0 ? '<span class="red">hiç ödemedi</span>' : '—')}</div>
      <div class="amt ${b > 0 ? 'red' : 'green'}">${b > 0 ? money(b / 100) : 'Borç yok'}</div>
    </div>`).join('');
}

}
function waLink(c, b){

  else if(!d.startsWith('90')) d = '90' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(`Merhaba ${c.name}, güncel veresiye bakiyeniz: ${money(b / 100)}.`)}`;
}
function openSummary(){
  const c = db.customers.find(x => x.id === ui.cid);
  const b = balanceK(c.id);
  const lp = lastPayDate(c.id);
  const lines = ledgerRows(c.id).slice(0, 12).map(({t}) => t.type === 'debt'
    ? `${fmtDate(t.date)}  borç ${money(t.kurus / 100)}  ${t.product}${t.qty ? ' (' + t.qty + ' ' + (t.unit || '') + ')' : ''}`
    : `${fmtDate(t.date)}  ödeme ${money(t.kurus / 100)}`);
  const text = `${c.name}\nToplam borç: ${money(b / 100)}\nSon ödeme: ${lp ? fmtDate(lp) : 'yok'}\n\nSon hareketler:\n${lines.join('\n') || 'Hareket yok'}`;
  openSheet('Borç özeti', `<pre id="sumtext" class="note-box">${esc(text)}</pre>`,
    `<button class="btn" onclick="copyText()">Kopyala</button><button class="btn primary" onclick="window.print()">Yazdır</button>`);
}
function copyText(){
  const t = $('#sumtext').textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Kopyalandı'), () => toast('Kopyalanamadı'));
  else toast('Kopyalanamadı');
}
function deleteCustomer(id){
  if(!confirm('Bu müşteri ve tüm hesap hareketleri silinecek. Emin misiniz?')) return;
  const c = db.customers.find(x => x.id === id);
  const ts = txsOf(id);
  trackDeletion('customers', id);
  ts.forEach(t => trackDeletion('transactions', t.id));
  db.customers = db.customers.filter(x => x.id !== id);
  db.transactions = db.transactions.filter(t => t.customerId !== id);
  save(); go('customers');
  toast('Müşteri silindi', () => {
    untrackDeletion('customers', id);
    ts.forEach(t => untrackDeletion('transactions', t.id));
    db.customers.push(c);
    db.transactions.push(...ts);
    save();
    render();
  });
}

/* ---------- veresiye / ödeme formu ---------- */
function openTxForm(kind, id){
  const t = id ? db.transactions.find(x => x.id === id) : null;
  if(t) ui.cid = t.customerId;
  const k = t ? t.type : kind;
  const c = db.customers.find(x => x.id === ui.cid);
  if(!c) return;
  const base = balanceK(c.id, id || null);
  const date = t ? t.date : ymd(new Date());
  const title = k === 'debt' ? (t ? 'Veresiyeyi düzenle' : 'Veresiye ekle') : (t ? 'Ödemeyi düzenle' : 'Ödeme al');
  const body = k === 'debt' ? `
    ${db.products.length ? `<label class="lbl">Kayıtlı üründen seç <span class="opt">fiyat otomatik dolar</span></label>
      <select class="inp" onchange="pickProduct(this.value)"><option value="">— seçmeden yazacağım —</option>
      ${db.products.map(p => `<option value="${p.id}">${esc(p.name)} (${money(p.price)} / ${esc(p.unit || 'birim')})</option>`).join('')}</select>` : ''}
    <div class="frow">
      <div><label class="lbl">Ürün</label><input class="inp" id="f-name" value="${esc(t ? t.product : '')}" placeholder="Örn: Büyükbaş yem"></div>
      <div><label class="lbl">Tarih</label><input class="inp" type="date" id="f-date" value="${date}"></div>
    </div>
    <div class="frow">
      <div><label class="lbl">Miktar</label><input class="inp" id="f-qty" inputmode="decimal" value="${t ? t.qty : ''}" placeholder="5"></div>
      <div><label class="lbl">Birim</label><input class="inp" id="f-unit" value="${esc(t ? t.unit : '')}" placeholder="çuval, kg"></div>
    </div>
    <label class="lbl">Birim fiyat (₺)</label>
    <input class="inp" id="f-price" inputmode="decimal" value="${t ? t.price : ''}" placeholder="Örn: 750">
    <label class="lbl">Not <span class="opt">isteğe bağlı</span></label>
    <input class="inp" id="f-note" value="${esc(t ? t.note : '')}">`
  : `
    <div class="frow">
      <div><label class="lbl">Ödenen tutar (₺)</label><input class="inp" id="f-amt" inputmode="decimal" value="${t ? t.kurus / 100 : ''}" placeholder="Örn: 1000"></div>
      <div><label class="lbl">Tarih</label><input class="inp" type="date" id="f-date" value="${date}"></div>
    </div>
    <label class="lbl">Ödeme şekli</label>
    <div class="pills" id="methods">${['Nakit','Havale/EFT','Kart','Diğer'].map(m =>
      `<button type="button" class="pill ${(t ? t.method : 'Nakit') === m ? 'on' : ''}" onclick="pickMethod(this,'${m}')">${m}</button>`).join('')}</div>
    <input type="hidden" id="f-method" value="${esc(t ? t.method : 'Nakit')}">
    <label class="lbl">Not <span class="opt">isteğe bağlı</span></label>
    <input class="inp" id="f-note" value="${esc(t ? t.note : 'Borçtan ödeme')}">`;
  openSheet(title,
    `<div class="help" style="margin-top:0">Müşteri: <b style="color:var(--ink)">${esc(c.name)}</b> · şu anki borç <b style="color:var(--ink)">${money(base / 100)}</b></div>
     <div id="txform" data-kind="${k}" data-base="${base}" oninput="preview()" onchange="preview()">
       ${body}<div id="prev"></div><div class="err" id="txerr"></div>
     </div>`,
    `<button class="btn" onclick="closeSheet()">Vazgeç</button>
     <button class="btn ${k === 'debt' ? 'debt' : 'pay'}" onclick="saveTx('${k}','${id || ''}')">${k === 'debt' ? 'Veresiyeyi kaydet' : 'Ödemeyi kaydet'}</button>`);
  preview();
}
function pickProduct(pid){
  const p = db.products.find(x => x.id === pid);
  if(!p) return;
  $('#f-name').value = p.name;
  $('#f-unit').value = p.unit || '';
  $('#f-price').value = p.price || '';
  preview();
}
function pickMethod(btn, m){
  document.querySelectorAll('#methods .pill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  $('#f-method').value = m;
}
function preview(){
  const f = $('#txform'); if(!f) return;
  const k = f.dataset.kind, base = Number(f.dataset.base) || 0;
  const box = $('#prev'), err = $('#txerr');
  if(k === 'debt'){
    const total = Math.round(num($('#f-qty').value) * num($('#f-price').value) * 100);
    box.innerHTML = `<div class="preview"><div class="l">Bu veresiyenin tutarı</div><div class="b">${money(total / 100)}</div>
      <div class="n">Kaydedince borç: ${money(base / 100)} → <b>${money((base + total) / 100)}</b></div></div>`;
    err.textContent = '';
  } else {
    const kurus = Math.round(num($('#f-amt').value) * 100);
    const over = kurus > base;
    box.innerHTML = `<div class="preview ${over ? 'bad' : ''}"><div class="l">Kaydedince kalan borç</div>
      <div class="b">${money(Math.max(base - kurus, 0) / 100)}</div>
      <div class="n">Şu an ${money(base / 100)} borç var${over ? '' : `, ${money(kurus / 100)} ödenecek`}</div></div>`;
    err.textContent = over ? 'Ödeme, müşterinin borcundan fazla. Tutarı düzeltin.' : '';
  }
}
function saveTx(kind, id){
  const fail = m => { $('#txerr').textContent = m; };
  const date = $('#f-date').value;
  if(!date) return fail('Tarihi seçin.');
  const tx = {customerId:ui.cid, type:kind, date};
  if(kind === 'debt'){
    const name = $('#f-name').value.trim(), qty = num($('#f-qty').value), price = num($('#f-price').value);
    if(!name) return fail('Ürün adını yazın.');
    if(!(qty > 0)) return fail('Miktarı yazın (0\'dan büyük olmalı).');
    if(!($('#f-price').value.trim() !== '')) return fail('Birim fiyatı yazın.');
    Object.assign(tx, {product:name, qty, unit:$('#f-unit').value.trim(), price, kurus:Math.round(qty * price * 100), note:$('#f-note').value.trim()});
  } else {
    const amt = num($('#f-amt').value);
    if(!(amt > 0)) return fail('Ödenen tutarı yazın (0\'dan büyük olmalı).');
    const kurus = Math.round(amt * 100);
    const base = balanceK(ui.cid, id || null);
    if(kurus > base) return fail('Ödeme müşterinin borcundan fazla. Tutarı düzeltin.');
    Object.assign(tx, {kurus, method:$('#f-method').value, note:$('#f-note').value.trim()});
  }
  if(id) Object.assign(db.transactions.find(t => t.id === id), tx);
  else { tx.id = uid(); tx.createdAt = Date.now(); db.transactions.push(tx); }
  save(); closeSheet(); toast(id ? 'Kayıt güncellendi' : 'Kaydedildi'); render();
}
function txMenu(id){
  const t = db.transactions.find(x => x.id === id);
  if(!t) return;
  const c = db.customers.find(x => x.id === t.customerId);
  openSheet(t.type === 'debt' ? 'Veresiye kaydı' : 'Ödeme kaydı', `<div class="card" style="padding:4px 16px">
      ${kv('Müşteri', esc(c ? c.name : '—'))}
      ${kv('Tarih', fmtDate(t.date))}
      ${t.type === 'debt'
        ? kv('Ürün', esc(t.product)) + kv('Miktar', `${t.qty} ${esc(t.unit || '')} × ${money(t.price)}`)
        : kv('Yöntem', esc(t.method || ''))}
      ${kv('Tutar', `<span class="${t.type === 'debt' ? 'red' : 'green'}">${money(t.kurus / 100)}</span>`)}
      ${t.note ? kv('Not', esc(t.note)) : ''}
    </div>`,
    `<button class="btn danger" onclick="deleteTx('${id}')">Sil</button>
     <button class="btn" onclick="openTxForm(null,'${id}')">Düzenle</button>`);
}
function deleteTx(id){
  if(!confirm('Bu kaydı silmek istediğinize emin misiniz?\nMüşterinin borcu buna göre yeniden hesaplanır.')) return;
  const idx = db.transactions.findIndex(t => t.id === id);
  if(idx < 0) return;
  const item = db.transactions[idx];
  trackDeletion('transactions', id);
  db.transactions.splice(idx, 1);
  save(); closeSheet(); render();
  toast('Kayıt silindi', () => {
    untrackDeletion('transactions', id);
    db.transactions.splice(Math.min(idx, db.transactions.length), 0, item);
    save();
    render();
  });
}

function saveProduct(id){
  const name = $('#p-name').value.trim();

  const unit = $('#p-unit').value.trim();
  if(!name){ $('#perr').textContent = 'Ürün adını yazın.'; return; }
  if(!($('#p-price').value.trim() !== '')){ $('#perr').textContent = 'Fiyatı yazın.'; return; }

  else db.products.push({id:uid(), name, price, unit});
  save(); closeSheet(); toast('Ürün kaydedildi'); render();

function deleteProduct(id){
  if(!confirm('Bu ürün listeden silinsin mi? Geçmiş kayıtlar silinmez.')) return;
  trackDeletion('products', id);
  db.products = db.products.filter(x => x.id !== id);
  save(); closeSheet(); render();
}

/* ---------- raporlar ---------- */
function rangeOf(){
  const t = ymd(new Date());
  if(ui.period === 'today') return [t, t];
  if(ui.period === 'week'){
    const d = new Date(), s = new Date(d);
    s.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return [ymd(s), t];
  }
  if(ui.period === 'month') return [t.slice(0, 8) + '01', t];
  if(ui.period === 'custom') return [ui.rs || '0000-01-01', ui.re || '9999-12-31'];
  return ['0000-01-01', '9999-12-31'];
}
function viewReports(){
  const [s, e] = rangeOf();
  const inR = db.transactions.filter(t => t.date >= s && t.date <= e);
  const debt = sumType(inR, 'debt') / 100, pay = sumType(inR, 'payment') / 100;

  const now = new Date();
  const months = [];
  for(let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({key:ymd(d).slice(0, 7), label:d.toLocaleDateString('tr-TR', {month:'short'})});
  }
  const monthSums = months.map(m => {
    const ts = db.transactions.filter(t => t.date.startsWith(m.key));
    return {...m, d:sumType(ts, 'debt'), p:sumType(ts, 'payment')};
  });
  const mx = Math.max(1, ...monthSums.map(m => Math.max(m.d, m.p)));
  const chart = monthSums.map(m => `<div class="col">
      <div class="bars">
        <div class="bar d" style="height:${Math.round(m.d / mx * 150)}px" title="Veresiye ${money(m.d / 100)}"></div>
        <div class="bar p" style="height:${Math.round(m.p / mx * 150)}px" title="Tahsilat ${money(m.p / 100)}"></div>
      </div>
      <span class="lb">${m.label}</span></div>`).join('');

  const agg = {};
  inR.filter(t => t.type === 'debt').forEach(t => {
    const k = t.product + '|' + (t.unit || '');
    agg[k] = agg[k] || {name:t.product, unit:t.unit, qty:0, total:0};
    agg[k].qty += t.qty;
    agg[k].total += t.kurus;
  });
  const prods = Object.values(agg).sort((x, y) => y.total - x.total).slice(0, 5);
  const debtors = db.customers.map(c => ({c, b:balanceK(c.id)})).filter(x => x.b > 0).sort((x, y) => y.b - x.b).slice(0, 5);

  return {
    title:'Raporlar',
    sub:'Dönemi seçin; rakamlar otomatik güncellenir',
    html:`
    <div class="toolbar">
      <div class="seg" data-seg="period"><span class="sind"></span>${[['today','Bugün'],['week','Bu hafta'],['month','Bu ay'],['all','Tümü'],['custom','Tarih aralığı']].map(([k, l]) =>
        `<button class="${ui.period === k ? 'on' : ''}" onclick="ui.period='${k}';render()">${l}</button>`).join('')}</div>
    </div>
    ${ui.period === 'custom' ? `<div class="frow" style="margin-bottom:14px">
      <div><label class="lbl">Başlangıç</label><input class="inp" type="date" value="${ui.rs}" onchange="ui.rs=this.value;render()"></div>
      <div><label class="lbl">Bitiş</label><input class="inp" type="date" value="${ui.re}" onchange="ui.re=this.value;render()"></div></div>` : ''}
    <div class="g3">
      ${stat('Verilen veresiye', money(debt), 'red', 'seçilen dönem')}
      ${stat('Alınan ödeme', money(pay), 'green', 'seçilen dönem')}
      ${stat('Şu anki toplam alacak', money(totalReceivable()), 'red', 'tüm müşteriler')}
    </div>
    <div class="two">
      <section class="card flat">
        <div class="ph"><h3>Son 6 ay</h3><span class="hint">veresiye ve tahsilat</span></div>
        <div class="chart">${chart}</div>
        <div class="legend"><span><i style="background:#fca5a5"></i>Veresiye</span><span><i style="background:#86efac"></i>Tahsilat</span></div>
      </section>
      <section class="card flat">
        <div class="ph"><h3>En çok borcu olanlar</h3></div>
        ${debtors.map(x => `<div class="row click" onclick="go('customer','${x.c.id}')"><div class="grow t1">${esc(x.c.name)}</div><div class="amt red">${money(x.b / 100)}</div></div>`).join('') || emptyBox('Borçlu müşteri yok', '')}
      </section>
    </div>
    <div class="two" style="margin-top:16px">
      <section class="card flat">
        <div class="ph"><h3>En çok satılan ürünler</h3><span class="hint">seçilen dönem</span></div>
        ${prods.map(p => `<div class="row"><div class="grow"><div class="t1">${esc(p.name)}</div><div class="t2">${Math.round(p.qty * 100) / 100} ${esc(p.unit || '')}</div></div><div class="amt">${money(p.total / 100)}</div></div>`).join('') || emptyBox('Bu dönemde veresiye yok', '')}
      </section>
      <section class="card flat">
        <div class="ph"><h3>Dönem özeti</h3></div>
        <div class="row"><div class="grow">Hareket sayısı</div><div class="amt">${inR.length}</div></div>
        <div class="row"><div class="grow">Net değişim <span class="hint">(veresiye − tahsilat)</span></div><div class="amt ${debt - pay > 0 ? 'red' : 'green'}">${money(debt - pay)}</div></div>
      </section>
    </div>`};
}

const SIM_FIRST=['Ahmet','Mehmet','Ali','Hasan','Hüseyin','Mustafa','Fatma','Ayşe','Emine','Zeynep','Hatice','Elif','İbrahim','Yusuf','Kadir','Süleyman','Hanife','Sevim'];
const SIM_LAST=['Yılmaz','Kaya','Demir','Şahin','Çelik','Aydın','Özdemir','Arslan','Doğan','Koç','Kurt','Güneş'];
const SIM_PRODUCTS=[['Büyükbaş yem',750,'çuval'],['Küçükbaş yem',690,'çuval'],['Tavuk yemi',520,'çuval'],['Mısır',18.5,'kg'],['Arpa',14,'kg'],['Buğday kepeği',260,'çuval'],['Ayçiçeği tohumu',95,'kg']];
const simPick = a => a[Math.floor(Math.random() * a.length)];
const simRnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const ymdOffset = d => { const x = new Date(); x.setDate(x.getDate() + d); return ymd(x); };
function simSeed(){
  if(db.customers.some(c => c.sim)) return toast('Test verisi zaten var; önce silin');
  const prods = SIM_PRODUCTS.map(([n, p, u]) => ({id:uid(), name:n, price:p, unit:u, sim:true}));
  db.products.push(...prods);
  const names = new Set();
  while(names.size < 14) names.add(simPick(SIM_FIRST) + ' ' + simPick(SIM_LAST));
  let n = 0;
  names.forEach(name => {
    const c = {id:uid(), name, phone:'05' + simRnd(30, 59) + ' ' + simRnd(100, 999) + ' ' + simRnd(10, 99) + ' ' + simRnd(10, 99), address:'', note:'', createdAt:Date.now(), sim:true};
    db.customers.push(c);
    let bal = 0;
    for(let i = simRnd(0, 4); i > 0; i--){
      const p = simPick(prods), qty = simRnd(1, 8);
      const t = {id:uid(), customerId:c.id, type:'debt', date:ymdOffset(-simRnd(0, 60)), product:p.name, qty, unit:p.unit, price:p.price, kurus:Math.round(qty * p.price * 100), method:'', note:'', createdAt:Date.now() + n++, sim:true};
      db.transactions.push(t); bal += t.kurus;
    }
    if(bal > 0 && Math.random() < 0.6){
      db.transactions.push({id:uid(), customerId:c.id, type:'payment', date:ymdOffset(-simRnd(0, 20)), product:'', qty:0, unit:'', price:0, kurus:Math.round(bal * simRnd(10, 70) / 100), method:simPick(['Nakit','Havale/EFT','Kart']), note:'Borçtan ödeme', createdAt:Date.now() + n++, sim:true});
    }
  });
  save(); toast('14 test müşterisi eklendi'); render();
}
function simClear(){
  const ids = new Set(db.customers.filter(c => c.sim).map(c => c.id));
  if(!ids.size && !db.products.some(p => p.sim)) return toast('Silinecek test verisi yok');
  db.customers = db.customers.filter(c => !c.sim);
  db.transactions = db.transactions.filter(t => !t.sim && !ids.has(t.customerId));
  db.products = db.products.filter(p => !p.sim);
  save(); toast('Test verileri silindi'); render();
}

function exportData(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'azaklioglu-yedek-' + ymd(new Date()) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let o;
    try{ o = JSON.parse(r.result); }catch(e){ toast('Dosya okunamadı'); return; }
    if(!o || !Array.isArray(o.customers) || !Array.isArray(o.transactions)){ toast('Bu bir Azaklıoğlu yedeği değil'); return; }
    if(!confirm('Mevcut kayıtlar bu yedekle değiştirilecek. Devam edilsin mi?')) return;
    db = normalize(o);
    save(); go('home'); toast('Yedek yüklendi');
  };
  r.readAsText(f);
}

}

const AUTH_PASS = 'ahmet1130';
const SESSION_KEY = 'azaklioglu-oturum';
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim()
  .replace(/İ/g, 'i').toLowerCase().replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c');
const sget = () => { try { return sessionStorage.getItem(SESSION_KEY); } catch(e) { return null; } };
const sset = v => { try { v ? sessionStorage.setItem(SESSION_KEY, v) : sessionStorage.removeItem(SESSION_KEY); } catch(e) {} };

const INTRO_STEPS = [[18,'Kayıtlar okunuyor…'],[42,'Müşteriler yükleniyor…'],[68,'Hesaplar hazırlanıyor…'],[90,'Son kontroller…'],[100,'Hazır']];
function runIntro(){
  $('#gate').hidden = false;
  $('#gate').classList.remove('out');
  $('#intro').hidden = false;
  $('#login').hidden = true;
  let i = 0, skipNow = false;
  $('#intro').onclick = () => { skipNow = true; };
  const step = () => {
    if(skipNow){
      $('#pbar').style.width = '100%';
      $('#pstat').textContent = 'Hazır';
      setTimeout(afterIntro, 150);
      return;
    }
    if(i >= INTRO_STEPS.length){ setTimeout(afterIntro, 250); return; }
    const [p, t] = INTRO_STEPS[i++];
    $('#pbar').style.width = p + '%';
    $('#pstat').textContent = t;
    setTimeout(step, 240 + Math.random() * 200);
  };
  setTimeout(step, 200);
}
function afterIntro(){
  $('#intro').hidden = true;
  if(sget() === '1'){ unlock(false); return; }
  $('#login').hidden = false;
  $('#l-user').focus();
}
function doLogin(){
  if(norm($('#l-user').value) === norm(AUTH_USER) && $('#l-pass').value.trim() === AUTH_PASS){
    sset('1');
    $('#l-err').textContent = '';
    $('#login').hidden = true;
    unlock(true);
  } else {
    $('#l-err').textContent = 'Kullanıcı adı veya şifre hatalı.';
    $('#l-pass').value = '';
    $('#l-pass').focus();
  }
}
function togglePw(){ const p = $('#l-pass'); p.type = p.type === 'password' ? 'text' : 'password'; }
function unlock(welcome){
  const gate = $('#gate');
  if(welcome) $('#welcome').hidden = false;
  setTimeout(() => {
    gate.classList.add('out');
    setTimeout(() => { gate.hidden = true; }, 650);
  }, welcome ? 1100 : 0);
}
function logout(){ sset(null); $('#login').hidden = true; runIntro(); }

runIntro();
</script>
</body>
